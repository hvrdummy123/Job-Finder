[project]
name = "job-radar"
version = "0.1.0"
description = "Personal Job Radar — aggregate careers pages for a fixed company list"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx[http2]>=0.27.0",
    "asyncpg>=0.30.0",
    "orjson>=3.10.0",
    "selectolax>=0.3.27",
    "extruct>=0.18.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
job-radar = "app.main:run"
seed-companies = "scripts.seed_companies:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]
